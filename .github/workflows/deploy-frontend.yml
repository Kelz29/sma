name: Deploy frontend

# Manual only: rebuilds the frontend with the CURRENT ngrok URL (or SMA_API_URL
# if set on the server) and FTP-uploads it to cPanel (app.smartseen.co.za).
# Run this whenever the ngrok tunnel URL changes — otherwise the live site
# keeps calling a dead endpoint and login fails as a browser "CORS error".
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SMA frontend via home server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SMA_SSH_HOST }}
          username: ${{ secrets.SMA_SSH_USER }}
          key: ${{ secrets.SMA_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            ~/Documents/sma/deploy-frontend.sh
