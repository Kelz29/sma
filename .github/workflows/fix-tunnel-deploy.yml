name: Fix tunnel + deploy frontend

# Manual: ensure the 'sma' ngrok tunnel exists on the home server, then deploy
# the frontend. Prints the ngrok agent's error body if tunnel creation fails.
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  fix:
    runs-on: [self-hosted, linux, sma]
    steps:
      - name: Ensure sma tunnel, then deploy frontend
        run: |
          echo "== create sma tunnel (error body shown) =="
          curl -s -m 10 -X POST http://127.0.0.1:4040/api/tunnels \
            -H 'Content-Type: application/json' \
            -d '{"name":"sma","addr":"http://localhost:8083","proto":"http"}' || true
          echo
          echo "== tunnels now =="
          curl -s -m 5 http://127.0.0.1:4040/api/tunnels
          echo
          URL=$(curl -s -m 5 http://127.0.0.1:4040/api/tunnels | python3 -c "
          import sys, json
          for t in json.load(sys.stdin).get('tunnels', []):
              if t.get('name') == 'sma' or str(t.get('config', {}).get('addr', '')).endswith(':8083'):
                  print(t.get('public_url', '')); break
          " || true)
          if [[ -z "$URL" ]]; then
            echo "ERROR: sma tunnel still missing (see ngrok error above)" >&2
            exit 1
          fi
          echo "sma tunnel: $URL"
          echo "== preflight check through tunnel =="
          curl -si -m 15 -X OPTIONS "$URL/api/v1/auth/login" \
            -H "Origin: https://app.smartseen.co.za" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization,x-tenant-id,ngrok-skip-browser-warning" \
            | head -20 || true
          echo "== deploy frontend =="
          ROOT="$HOME/Documents/sma"
          REPO="$ROOT/repo"
          if [[ ! -d "$REPO/.git" ]]; then
            git clone --branch main https://github.com/Kelz29/sma.git "$REPO"
          fi
          git -C "$REPO" fetch origin main
          git -C "$REPO" checkout main
          git -C "$REPO" reset --hard origin/main
          install -m 755 "$REPO/deploy/deploy-frontend.sh" "$ROOT/deploy-frontend.sh"
          "$ROOT/deploy-frontend.sh"
