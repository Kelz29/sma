name: Diagnose server

# Manual, read-only diagnostics on the home server (self-hosted runner).
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, linux, sma]
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Server diagnostics
        run: |
          echo "== ngrok tunnels =="
          curl -s -m 5 http://127.0.0.1:4040/api/tunnels || echo "(agent unreachable)"
          echo
          echo "== ngrok processes =="
          ps aux | grep -i '[n]grok' || echo "(none)"
          echo "== pm2 =="
          pm2 list 2>/dev/null || echo "(pm2 unavailable)"
          echo "== backend health (127.0.0.1:8083) =="
          curl -s -m 5 http://127.0.0.1:8083/health || echo "(backend unreachable)"
          echo
          echo "== listening ports 4040/8083 =="
          ss -ltn | grep -E ':(4040|8083)' || echo "(neither listening)"
          echo "== ngrok config (authtoken redacted) =="
          sed 's/authtoken:.*/authtoken: REDACTED/' ~/.config/ngrok/ngrok.yml 2>/dev/null || echo "(no ngrok.yml)"
          echo "== last frontend deploy log =="
          tail -n 30 "$HOME/Documents/sma/logs/deploy-frontend.log" 2>/dev/null || echo "(no log)"
          echo "== cloudflared =="
          which cloudflared && cloudflared --version || echo "(cloudflared not installed)"
          ls -la ~/.cloudflared/ 2>/dev/null || echo "(no ~/.cloudflared)"
          echo "== arch =="
          uname -m
          echo "== cf-login logs =="
          echo "--- error log ---"
          tail -n 40 "$HOME/.pm2/logs/cf-login-error.log" 2>/dev/null || echo "(none)"
          echo "--- out log ---"
          tail -n 40 "$HOME/.pm2/logs/cf-login-out.log" 2>/dev/null || echo "(none)"
          ls -la "$HOME/.cloudflared/" 2>/dev/null || echo "(no .cloudflared dir)"
          echo "== cloudflare reachability from server =="
          for h in login.cloudflareaccess.org api.cloudflare.com dash.cloudflare.com region1.v2.argotunnel.com; do
            echo -n "$h: "
            curl -s -o /dev/null -m 8 -w "%{http_code} (%{time_total}s)\n" "https://$h/" || echo "UNREACHABLE"
          done
          echo "== cloudflare zone bot/settings probe =="
          if [[ -n "${CF_TOKEN:-}" ]]; then
            API="https://api.cloudflare.com/client/v4"
            ZID=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "$API/zones?name=smartseen.co.za" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')" 2>/dev/null || true)
            echo "zone id: ${ZID:0:8}..."
            for ep in "settings/security_level" "settings/browser_check" "settings/challenge_ttl" "bot_management"; do
              echo "--- $ep ---"
              curl -s -m 10 -H "Authorization: Bearer $CF_TOKEN" "$API/zones/$ZID/$ep" | head -c 400; echo
            done
          else
            echo "(no token)"
          fi
