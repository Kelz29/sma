name: Setup API tunnel

# One-shot: cloudflared login (foreground, single job) -> tunnel 'sma-api' ->
# DNS api.smartseen.co.za -> pm2 service -> frontend redeploy on the stable URL.
# The login URL is handed off via a run artifact (download requires an
# authenticated token even though the repo is public — never put it in an
# issue/PR/file). NOTE: do not run the login under pm2 — cloudflared login
# expires and pm2 restarts mint a fresh URL, invalidating the previous one.
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, linux, sma]
    steps:
      - name: Start cloudflared login (background in this job)
        run: |
          set -euo pipefail
          pm2 delete cf-login >/dev/null 2>&1 || true
          mkdir -p "$HOME/.cloudflared"
          if [[ -f "$HOME/.cloudflared/cert.pem" ]]; then
            echo "cert.pem already exists — skipping login"
            exit 0
          fi
          rm -f /tmp/cf-login.log /tmp/cf-login-url.txt
          setsid bash -c 'cloudflared tunnel login > /tmp/cf-login.log 2>&1' &
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://dash\.cloudflare\.com[^ "'"'"']*' /tmp/cf-login.log 2>/dev/null | head -n1 || true)
            [[ -n "$URL" ]] && break
            sleep 2
          done
          if [[ -z "${URL:-}" ]]; then
            echo "ERROR: login URL not generated" >&2
            cat /tmp/cf-login.log || true
            exit 1
          fi
          echo "$URL" > /tmp/cf-login-url.txt
          echo "login URL captured to artifact"

      - name: Upload login URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-login-url
          path: /tmp/cf-login-url.txt
          retention-days: 1
          if-no-files-found: warn

      - name: Wait for cert, create tunnel, deploy
        run: |
          set -euo pipefail
          CF="$HOME/.cloudflared"
          mkdir -p "$CF"

          echo "== wait for cert.pem (authorize in browser; up to 25 min) =="
          for i in $(seq 1 100); do
            [[ -f "$CF/cert.pem" ]] && break
            sleep 15
          done
          if [[ ! -f "$CF/cert.pem" ]]; then
            echo "ERROR: cert.pem not found — authorization not completed in time" >&2
            tail -n 20 /tmp/cf-login.log 2>/dev/null || true
            exit 1
          fi
          echo "cert.pem present"

          echo "== create tunnel sma-api (idempotent) =="
          if ! cloudflared tunnel list 2>/dev/null | grep -q "sma-api"; then
            cloudflared tunnel create sma-api
          fi
          UUID=$(basename "$(ls "$CF"/*.json | head -n1)" .json)
          echo "tunnel UUID: $UUID"

          echo "== write config.yml =="
          {
            echo "tunnel: $UUID"
            echo "credentials-file: $CF/$UUID.json"
            echo "ingress:"
            echo "  - hostname: api.smartseen.co.za"
            echo "    service: http://localhost:8083"
            echo "  - service: http_status:404"
          } > "$CF/config.yml"
          cat "$CF/config.yml"

          echo "== route DNS api.smartseen.co.za =="
          cloudflared tunnel route dns sma-api api.smartseen.co.za || true

          echo "== run under pm2 =="
          pm2 delete sma-cloudflared >/dev/null 2>&1 || true
          pm2 start /usr/local/bin/cloudflared --name sma-cloudflared -- tunnel --config "$CF/config.yml" run sma-api
          pm2 save

          echo "== wait for https://api.smartseen.co.za/health =="
          OK=""
          for i in $(seq 1 30); do
            if curl -fsS -m 10 https://api.smartseen.co.za/health; then OK=1; break; fi
            sleep 10
          done
          echo
          if [[ -z "$OK" ]]; then
            echo "ERROR: api.smartseen.co.za/health not reachable" >&2
            pm2 logs sma-cloudflared --nostream --lines 40 || true
            exit 1
          fi

          echo "== preflight from app origin =="
          curl -si -m 15 -X OPTIONS https://api.smartseen.co.za/api/v1/auth/login \
            -H "Origin: https://app.smartseen.co.za" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization,x-tenant-id" | head -12

          echo "== record stable API URL + deploy frontend =="
          ROOT="$HOME/Documents/sma"
          REPO="$ROOT/repo"
          echo "https://api.smartseen.co.za/api/v1" > "$ROOT/stable-api-url.txt"
          if [[ ! -d "$REPO/.git" ]]; then
            git clone --branch main https://github.com/Kelz29/sma.git "$REPO"
          fi
          git -C "$REPO" fetch origin main
          git -C "$REPO" checkout main
          git -C "$REPO" reset --hard origin/main
          install -m 755 "$REPO/deploy/deploy-frontend.sh" "$ROOT/deploy-frontend.sh"
          SMA_API_URL="https://api.smartseen.co.za/api/v1" "$ROOT/deploy-frontend.sh"
          echo "== setup complete =="
