name: Setup API tunnel

# Creates a remotely-managed Cloudflare Tunnel 'sma-api' via the CF API
# (secret CLOUDFLARE_API_TOKEN), points api.smartseen.co.za at it, runs
# cloudflared under pm2 -> http://localhost:8083, then redeploys the frontend
# baked with https://api.smartseen.co.za/api/v1. Idempotent; safe to re-run.
on:
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  setup:
    runs-on: [self-hosted, linux, sma]
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Create tunnel via API, DNS, service, deploy
        run: |
          set -euo pipefail
          if [[ -z "${CF_TOKEN:-}" ]]; then
            echo "ERROR: GitHub secret CLOUDFLARE_API_TOKEN is not set" >&2
            exit 1
          fi
          echo "::add-mask::$CF_TOKEN"
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer $CF_TOKEN"
          CF="$HOME/.cloudflared"
          mkdir -p "$CF"
          pm2 delete cf-login >/dev/null 2>&1 || true

          echo "== verify token + locate zone =="
          ZONE_JSON=$(curl -fsS -H "$AUTH" "$API/zones?name=smartseen.co.za")
          ZONE_ID=$(echo "$ZONE_JSON" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['id'] if r else '')")
          ACCT_ID=$(echo "$ZONE_JSON" | python3 -c "import sys,json; r=json.load(sys.stdin)['result']; print(r[0]['account']['id'] if r else '')")
          if [[ -z "$ZONE_ID" || -z "$ACCT_ID" ]]; then
            echo "ERROR: token cannot see zone smartseen.co.za" >&2
            exit 1
          fi
          echo "zone + account located"

          echo "== create/find tunnel sma-api =="
          TUNNELS=$(curl -fsS -H "$AUTH" "$API/accounts/$ACCT_ID/tunnels?is_deleted=false")
          TUN_ID=$(echo "$TUNNELS" | python3 -c "
          import sys,json
          for t in json.load(sys.stdin).get('result') or []:
              if t.get('name')=='sma-api': print(t['id']); break
          else: print('')
          ")
          if [[ -z "$TUN_ID" ]]; then
            TUN_ID=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              "$API/accounts/$ACCT_ID/tunnels" \
              -d '{"name":"sma-api","config_src":"cloudflare"}' \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
            echo "tunnel created"
          else
            echo "tunnel exists, reusing"
          fi

          echo "== push tunnel ingress config =="
          curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/accounts/$ACCT_ID/tunnels/$TUN_ID/configurations" \
            -d '{"config":{"ingress":[{"hostname":"api.smartseen.co.za","service":"http://localhost:8083"},{"service":"http_status:404"}]}}' \
            >/dev/null
          echo "ingress set"

          echo "== DNS CNAME api.smartseen.co.za -> $TUN_ID.cfargotunnel.com =="
          REC=$(curl -fsS -H "$AUTH" "$API/zones/$ZONE_ID/dns_records?name=api.smartseen.co.za")
          REC_ID=$(echo "$REC" | python3 -c "import sys,json; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
          BODY="{\"type\":\"CNAME\",\"name\":\"api\",\"content\":\"$TUN_ID.cfargotunnel.com\",\"proxied\":true}"
          if [[ -n "$REC_ID" ]]; then
            curl -fsS -X PUT -H "$AUTH" -H 'Content-Type: application/json' "$API/zones/$ZONE_ID/dns_records/$REC_ID" -d "$BODY" >/dev/null
          else
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$API/zones/$ZONE_ID/dns_records" -d "$BODY" >/dev/null
          fi
          echo "DNS set"

          echo "== fetch tunnel token to server file (600) =="
          TUN_TOKEN=$(curl -fsS -H "$AUTH" "$API/accounts/$ACCT_ID/tunnels/$TUN_ID/token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'])")
          echo "::add-mask::$TUN_TOKEN"
          umask 077
          printf '%s' "$TUN_TOKEN" > "$CF/sma-api.token"
          chmod 600 "$CF/sma-api.token"

          echo "== run under pm2 =="
          pm2 delete sma-cloudflared >/dev/null 2>&1 || true
          TUNNEL_TOKEN_FILE="$CF/sma-api.token" pm2 start /usr/local/bin/cloudflared --name sma-cloudflared -- tunnel run
          pm2 save
          sleep 5
          pm2 describe sma-cloudflared | grep -E "status|restarts" || true

          echo "== wait for https://api.smartseen.co.za/health =="
          OK=""
          for i in $(seq 1 30); do
            if curl -fsS -m 10 https://api.smartseen.co.za/health; then OK=1; break; fi
            sleep 10
          done
          echo
          if [[ -z "$OK" ]]; then
            echo "ERROR: api.smartseen.co.za/health not reachable" >&2
            pm2 logs sma-cloudflared --nostream --lines 40 || true
            exit 1
          fi

          echo "== preflight from app origin =="
          curl -si -m 15 -X OPTIONS https://api.smartseen.co.za/api/v1/auth/login \
            -H "Origin: https://app.smartseen.co.za" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization,x-tenant-id" | head -12

          echo "== record stable API URL + deploy frontend =="
          ROOT="$HOME/Documents/sma"
          REPO="$ROOT/repo"
          echo "https://api.smartseen.co.za/api/v1" > "$ROOT/stable-api-url.txt"
          if [[ ! -d "$REPO/.git" ]]; then
            git clone --branch main https://github.com/Kelz29/sma.git "$REPO"
          fi
          git -C "$REPO" fetch origin main
          git -C "$REPO" checkout main
          git -C "$REPO" reset --hard origin/main
          install -m 755 "$REPO/deploy/deploy-frontend.sh" "$ROOT/deploy-frontend.sh"
          SMA_API_URL="https://api.smartseen.co.za/api/v1" "$ROOT/deploy-frontend.sh"
          echo "== setup complete =="
