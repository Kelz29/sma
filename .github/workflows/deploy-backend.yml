name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    # Home server runner registered for Kelz29/sma (cannot use ubuntu-latest:
    # the API host is on Tailscale and not reachable from GitHub-hosted runners).
    runs-on: [self-hosted, linux, sma]
    steps:
      - name: Deploy SMA backend on home server
        run: |
          set -euo pipefail
          ~/Documents/sma/deploy.sh
