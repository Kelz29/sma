<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SmartSeen</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='18' fill='%230a0a0a'/%3E%3Crect x='10' y='9' width='44' height='18' rx='9' fill='%23ffffff'/%3E%3Crect x='24' y='53' width='44' height='18' rx='9' fill='%23ffffff'/%3E%3Crect x='15' y='9' width='34' height='22' rx='7' fill='%230a0a0a'/%3E%3Crect x='9' y='49' width='34' height='22' rx='7' fill='%230a0a0a'/%3E%3Crect x='7' y='31' width='64' height='18' rx='9' fill='%23c8f135'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <script>
      (function() {
        var t = localStorage.getItem('sma-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else if (t === 'light') document.documentElement.classList.remove('dark');
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
